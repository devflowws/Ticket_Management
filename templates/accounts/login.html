<!-- templates/accounts/login.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - TicketManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .login-body {
            padding: 40px;
        }
        .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 1px solid #e0e0e0;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102,126,234,0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            width: 100%;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }
        .company-selector {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .company-item {
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .company-item:hover {
            background: #e9ecef;
        }
        .company-item.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .role-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .role-admin { background: #dc3545; color: white; }
        .role-employee { background: #28a745; color: white; }
        .role-validator { background: #ffc107; color: #333; }
        .role-finance { background: #17a2b8; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card">
                    <div class="login-header">
                        <i class="fas fa-ticket-alt fa-3x mb-3"></i>
                        <h2>Bienvenue</h2>
                        <p>Connectez-vous à votre espace</p>
                    </div>
                    <div class="login-body">
                        <div class="company-selector">
                            <label class="form-label fw-bold"><i class="fas fa-building"></i> Sélectionnez votre entreprise</label>
                            <div id="companyList">
                                <div class="company-item" data-company-id="1">
                                    <strong>Ma Société SARL</strong><br>
                                    <small>Abidjan, Côte d'Ivoire</small>
                                </div>
                                <div class="company-item" data-company-id="2">
                                    <strong>Groupe Entreprise SA</strong><br>
                                    <small>Dakar, Sénégal</small>
                                </div>
                                <div class="company-item" data-company-id="3">
                                    <strong>Startup Innov SARL</strong><br>
                                    <small>Lomé, Togo</small>
                                </div>
                            </div>
                        </div>
                        
                        <form method="post" action="/login/">
                            {% csrf_token %}
                            <input type="hidden" name="company_id" id="selectedCompany" required>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email</label>
                                <input type="email" name="email" class="form-control" placeholder="votre@email.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Mot de passe</label>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>
                            <button type="submit" class="btn btn-login text-white">
                                <i class="fas fa-sign-in-alt"></i> Se connecter
                            </button>
                        </form>
                        
                        <div class="text-center mt-4">
                            <p>Pas encore de compte ? <a href="/register-company/">Inscrire mon entreprise</a></p>
                            <p><a href="#">Mot de passe oublié ?</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Sélection de l'entreprise
        document.querySelectorAll('.company-item').forEach(item => {
            item.addEventListener('click', function() {
                document.querySelectorAll('.company-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('selectedCompany').value = this.dataset.companyId;
            });
        });
    </script>
</body>
</html>
